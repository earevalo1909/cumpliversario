<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Consuelo 🌻</title>
<meta name="theme-color" content="#ffd3a0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body class="bloqueado">
<!-- Dibujos reutilizables (el girasol se arma en js/vida.js) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><radialGradient id="gc"><stop offset="0" stop-color="#8a5522"/><stop offset="1" stop-color="#3b200a"/></radialGradient></defs>
  <symbol id="girasol" viewBox="-50 -50 100 100"></symbol>
</svg>

<div id="campo" aria-hidden="true"></div>
<canvas id="lluvia" aria-hidden="true"></canvas>

<div id="puerta">
  <button id="capullo" aria-label="Toca el girasol para abrir">
    <svg viewBox="-50 -50 100 100"><use href="#girasol" x="-50" y="-50" width="100" height="100"/></svg>
  </button>
  <p id="textoPuerta"></p>
  <small>toca el girasol</small>
</div>

<main id="main"></main>
<button id="botonMusica" aria-label="Música" hidden>🎵</button>
<div id="visor" hidden></div>
<audio id="audio" preload="none" playsinline></audio>

<script src="contenido.js"></script>
<script src="vida.js"></script>
</body>
</html>
